apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $.Values.werf.name }}
spec:
  parentRefs:
  - name: stand
    namespace: kgateway-system
  hostnames:
  - {{ $.Values.env.DOMAIN | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /{{ $.Values.werf.name }}
    backendRefs:
    - name: {{ $.Values.werf.name }}
      port: 3000
  - matches:
    - path:
        type: Exact
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        path:
          type: ReplaceFullPath
          replaceFullPath: /{{ $.Values.werf.name }}
        statusCode: 302
