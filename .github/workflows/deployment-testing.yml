name: Testing Deployment
on:
  push:
    branches: ["main", "master"]
  pull_request:
    types: [labeled, unlabeled, synchronize, closed, reopened]
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout
  packages: write # This is required for package publish
  pull-requests: write # This is required for posting comments
jobs:
  call-deployment:
    uses: ./.github/workflows/deployment.yml
    with:
      # LEGACY: приложение входит в БАЗУ КЛИЕНТСКИМ сертификатом autocert (site.*),
      # поэтому поду он нужен. Раньше это давал дефолт iconicactions; теперь задаём явно,
      # иначе werf.sh снимет метку autocert с namespace и вход в базу отвалится при рестарте.
      AUTOCERT_ENABLED: true
      #RUNS_ON: self-hosted
      DOCKER_BUILDKIT: true
      WERF_ENV: testing
      DATABASE_URL: postgres://postgresql01.icncd.ru
    secrets:
      WERF_SECRET_KEY: ${{ secrets.WERF_SECRET_KEY }}
